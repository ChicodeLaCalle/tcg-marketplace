<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Marketplace - Card Price Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>🎴 TCG Marketplace</h1>
      <p>Trading Card Game Price Tracker</p>
      
      <!-- Game Switcher -->
      <div class="game-switcher">
        <button class="game-btn active" data-game="pokemon">
          <span class="game-icon">⚡</span>
          <span class="game-name">Pokemon TCG</span>
        </button>
        <button class="game-btn" data-game="onepiece">
          <span class="game-icon">☠️</span>
          <span class="game-name">One Piece</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="gameInfo" class="game-info">
      <span class="game-badge pokemon">⚡ Pokemon TCG</span>
    </div>

    <section class="search-section">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for a Pokemon card (e.g., Charizard, Pikachu)..." autocomplete="off">
        <button id="searchBtn">Search</button>
      </div>
      <div id="searchStatus" class="search-status"></div>
    </section>

    <section class="filters">
      <select id="setFilter">
        <option value="">All Sets</option>
      </select>
    </section>

    <section id="results" class="results">
      <!-- Random cards will load here initially -->
    </section>

    <div id="pagination" class="pagination"></div>

    <!-- Featured/Random Cards Section -->
    <section id="featuredSection" class="featured-section">
      <h2>🔥 Featured Cards</h2>
      <p class="featured-subtitle">Popular cards trending right now</p>
      <div id="featuredCards" class="featured-grid">
        <span class="loading"></span> Loading featured cards...
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p id="footerText">Powered by <a href="https://pokemontcg.io/" target="_blank">Pokemon TCG API</a></p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
